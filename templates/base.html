<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Environment · C1{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4a37'/%3E%3Cpath d='M23 8c-9 0-14 5-14 12 0 2 1 4 1 4s1-6 7-9c-4 3-5 6-5 9 7 0 11-6 11-16z' fill='%239cc79a'/%3E%3C/svg%3E">
  {% block head %}{% endblock %}
</head>
<body>
  <svg class="leaves" viewBox="0 0 200 200" aria-hidden="true">
    <g fill="none" stroke="#3f7d5a" stroke-width="1.2" opacity=".55">
      <path d="M160 30c-60 5-95 45-95 100 0 15 6 30 6 30s5-45 50-70c-30 25-38 48-38 70 52 0 80-45 77-130z" fill="#9cc79a" fill-opacity=".35"/>
      <path d="M71 160c10-30 30-55 60-80"/>
      <path d="M60 95c-30 0-50 20-50 45 0 6 2 11 2 11s4-20 22-30c-12 10-15 20-15 30 22 0 38-20 41-56z" fill="#d99a2b" fill-opacity=".18"/>
    </g>
  </svg>
  <div class="shell {% block shell_class %}{% endblock %}">
    <header class="topbar">
      <a class="brand" href="{% block brand_href %}#{% endblock %}">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
        </span>
        <span>
          <div class="brand-title">Environment</div>
          <div class="brand-sub">Advanced vocabulary · C1</div>
        </span>
      </a>
      {% block topright %}{% endblock %}
    </header>
    {% block content %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
